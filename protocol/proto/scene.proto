syntax = "proto2";
package Scene;

message ReqMove {
    required int32 common = 1;
    required float time = 2;
    required float dx = 3;
    required float dy = 4;
    required float dz = 5;
}

message RespMove {
    required int32 common = 1;
    required float time = 2;
    required float dx = 3;
    required float dy = 4;
    required float dz = 5;
    optional bool forced = 6;   // true: server forced back
    optional uint64 uid = 7;    // 移动的玩家 uid，广播时用于区分是谁
}

message UnitEnter {
    required uint64 uid = 1;
    required float x = 2;
    required float y = 3;
    required float z = 4;
    optional int32 common = 5;
    optional int32 hp = 6;
    optional int32 maxHp = 7;
    optional uint32 entityId = 8;   // 怪物/角色模板 id，玩家为 0
    optional uint32 unitType = 9;   // 0 玩家，1 怪物
}

message UnitLeave {
    required uint64 uid = 1;
}

message ReqCastSkill {
    required uint32 skillId = 1;
    required uint64 targetUid = 2;
}

message RespCastSkill {
    required int32 code = 1;        // 0 成功，非 0 失败
    required uint64 targetUid = 2;
    required int32 damage = 3;
    required int32 targetHp = 4;
}

message UnitHp {
    required uint64 uid = 1;
    required int32 hp = 2;
    required int32 maxHp = 3;
}

message UnitDead {
    required uint64 uid = 1;
}

message ReqRevive {
}

message RespRevive {
    required uint64 uid = 1;
    required float x = 2;
    required float y = 3;
    required float z = 4;
    required int32 hp = 5;
    required int32 maxHp = 6;
}

message ReqEnter {
    required uint32 sceneId = 1;
}

message RespEnter {
    required uint32 sceneId = 1;
    required float x = 2;
    required float y = 3;
    required float z = 4;
}