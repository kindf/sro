syntax = "proto2";
package Scene;

message ReqMove {
    required int32 common = 1;
    required float time = 2;
    required float dx = 3;
    required float dy = 4;
    required float dz = 5;
}

message RespMove {
    required int32 common = 1;
    required float time = 2;
    required float dx = 3;
    required float dy = 4;
    required float dz = 5;
    optional bool forced = 6;   // true: server forced back
    optional uint64 uid = 7;    // 移动的玩家 uid，广播时用于区分是谁
}

message UnitEnter {
    required uint64 uid = 1;
    required float x = 2;
    required float y = 3;
    required float z = 4;
    optional int32 common = 5;
}

message UnitLeave {
    required uint64 uid = 1;
}

message ReqEnter {
    required uint32 sceneId = 1;
}

message RespEnter {
    required uint32 sceneId = 1;
    required float x = 2;
    required float y = 3;
    required float z = 4;
}