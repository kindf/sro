syntax = "proto2";
package Scene;

message ReqMove {
    required int32 common = 1;
    required float time = 2;
    required float dx = 3;
    required float dy = 4;
    required float dz = 5;
}

message RespMove {
    required int32 common = 1;
    required float time = 2;
    required float dx = 3;
    required float dy = 4;
    required float dz = 5;
    optional bool forced = 6;   // true: server forced back
    optional uint64 uid = 7;    // 移动的玩家 uid，广播时用于区分是谁
}